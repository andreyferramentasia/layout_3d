<nav class="flex items-center justify-between gap-4 px-6 sm:px-10 py-5 border-b border-preto/10">
  <a href="{% url 'projects3d:project-list' %}" class="text-sm font-medium tracking-[0.35em] uppercase">
    Rafael Castro <span class="font-light">Arquitetos</span>
  </a>

  {% if user.is_authenticated %}
    <div class="flex items-center gap-6">
      <span class="hidden sm:inline text-sm text-preto/60">Olá, {{ user.first_name|default:user.username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="text-xs tracking-[0.3em] uppercase underline underline-offset-4 decoration-verde cursor-pointer hover:text-verde">Sair</button>
      </form>
    </div>
  {% endif %}
</nav>

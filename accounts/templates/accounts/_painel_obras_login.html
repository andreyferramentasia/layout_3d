{% load static %}
<aside class="relative hidden lg:block overflow-hidden bg-neutral">
  <div class="absolute inset-0">
    <img src="{% static 'accounts/img/torre-le-blu.png' %}" alt="Torre residencial com varandas curvas e vegetação" class="obra absolute inset-0 w-full h-full object-cover">
    <img src="{% static 'accounts/img/vista-aerea.png' %}" alt="Vista aérea de projeto com formas orgânicas iluminadas" class="obra absolute inset-0 w-full h-full object-cover">
    <img src="{% static 'accounts/img/pavilhao-orla.png' %}" alt="Pavilhão curvo na orla ao pôr do sol" class="obra absolute inset-0 w-full h-full object-cover">
    <img src="{% static 'accounts/img/torre-sinuosa-pb.png' %}" alt="Torre de fachada sinuosa em preto e branco" class="obra absolute inset-0 w-full h-full object-cover">
  </div>
  <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-black/40"></div>

  <div class="relative h-full flex flex-col justify-between p-12 text-white">
    <p class="text-sm font-medium tracking-[0.35em] uppercase">
      Rafael Castro <span class="font-light">Arquitetos</span>
    </p>

    <div class="space-y-5 max-w-md">
      <p class="text-xs tracking-[0.35em] uppercase text-white/70">Architecture + Biomimetics + Engineering</p>
      <h1 class="font-serifa text-4xl leading-[1.15]">
        O que uma arquitetura precisa para <em>não ser igual</em> a todas as outras?
      </h1>
      <p class="text-white/70 text-sm">Award-winning brazilian architecture studio.</p>
    </div>
  </div>
</aside>
